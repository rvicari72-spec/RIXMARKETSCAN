name: Weekly Market Scan

on:
  schedule:
    - cron: "0 5 * * 1"        # Mondays 05:00 UTC (06:00 UK summer time)
  workflow_dispatch:           # "Run workflow" button for manual runs
    inputs:
      send_email:
        description: "Send the email (untick = render only)"
        type: boolean
        default: true
      fresh_scan:
        description: "Fresh scan (tick = ignore this week's saved results and search again)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for WeasyPrint
        run: sudo apt-get update -q && sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu fonts-crosextra-carlito

      - run: pip install -r requirements.txt

      - name: Run the scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send_email }}" = "false" ]; then ARGS="$ARGS --no-email"; fi
            if [ "${{ inputs.fresh_scan }}" = "true" ]; then ARGS="$ARGS --rescan"; fi
          fi
          python scan.py $ARGS

      - name: Archive the edition in the repo
        if: always()
        run: |
          git config user.name "market-scan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add editions/
          git commit -m "Market Scan $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: market-scan-pdf
          path: editions/*
